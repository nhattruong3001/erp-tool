<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Tiện Ích TGDD</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 440px;
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
}

h2 {
    text-align: center;
    color: #2c3e50;
    margin: 0 0 20px;
}

.tabs {
    display: flex;
    border-bottom: 2px solid #e2e8f0;
    margin-bottom: 20px;
}

.tab-btn {
    flex: 1;
    padding: 11px 5px;
    border: 0;
    background: transparent;
    color: #718096;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    border-bottom: 3px solid transparent;
}

.tab-btn:hover {
    color: #007bff;
}

.tab-btn.active {
    color: #007bff;
    border-bottom-color: #007bff;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #4a5568;
}

input[type="text"] {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e0;
    border-radius: 6px;
    font-size: 15px;
}

input[type="text"]:focus {
    outline: none;
    border-color: #007bff;
}

.action-btn {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 6px;
    background: #007bff;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.action-btn:hover {
    background: #0056b3;
}

.btn-green {
    background: #28a745;
}

.btn-green:hover {
    background: #218838;
}

.note {
    margin-top: 15px;
    padding: 10px;
    background: #edf2f7;
    border-radius: 6px;
    color: #718096;
    font-size: 13px;
    line-height: 1.5;
}

.status {
    margin-top: 12px;
    padding: 10px;
    background: #edf2f7;
    color: #4a5568;
    border-radius: 6px;
    font-size: 13px;
    display: none;
}

.status.show {
    display: block;
}
</style>
</head>

<body>

<div class="container">

<h2>Hệ Thống Tiện Ích TGDD</h2>

<div class="tabs">

    <button type="button"
            class="tab-btn active"
            data-tab="tab-erp">
        1. Cài ERP & Đổi Tên
    </button>

    <button type="button"
            class="tab-btn"
            data-tab="tab-camwin">
        2. Cài CamWin
    </button>

</div>


<!-- ================= ERP ================= -->

<div id="tab-erp" class="tab-content active">

    <div class="form-group">

        <label for="computerName">
            Nhập tên máy tính mới:
        </label>

        <input
            type="text"
            id="computerName"
            placeholder="Ví dụ: 179188"
            maxlength="15"
        >

    </div>

    <button
        type="button"
        id="btnErp"
        class="action-btn">

        Tải File Cài Đặt (Setup.bat)

    </button>

    <div class="note">
        📌 <b>Hướng dẫn:</b>
        Nhấp đúp mở file <b>Setup.bat</b>
        → Bấm <b>Yes</b> để tự động cài đặt.
    </div>

</div>


<!-- ================= CAMWIN ================= -->

<div id="tab-camwin" class="tab-content">

    <p style="font-size:14px;color:#4a5568;margin-top:0;">
        Gói cài đặt tự động tải <b>CamWin</b>,
        giải nén và tạo Shortcut ngoài Desktop.
    </p>

    <button
        type="button"
        id="btnCamwin"
        class="action-btn btn-green">

        Tải Gói Cài CamWin (Setup-CamWin.bat)

    </button>

    <div id="camwinStatus" class="status"></div>

    <div class="note">
        📌 <b>Hướng dẫn:</b>
        Nhấp đúp mở file <b>Setup-CamWin.bat</b>
        → Bấm <b>Yes</b>.
    </div>

</div>

</div>


<script>

/* =====================================================
   KHỞI TẠO
===================================================== */

document.addEventListener("DOMContentLoaded", function () {

    /* ---------- TAB ---------- */

    const tabButtons = document.querySelectorAll(".tab-btn");

    const tabContents = document.querySelectorAll(".tab-content");


    tabButtons.forEach(function (button) {

        button.addEventListener("click", function () {

            const tabId = button.getAttribute("data-tab");


            tabButtons.forEach(function (btn) {
                btn.classList.remove("active");
            });


            tabContents.forEach(function (content) {
                content.classList.remove("active");
            });


            button.classList.add("active");


            const target =
                document.getElementById(tabId);


            if (target) {
                target.classList.add("active");
            }

        });

    });


    /* ---------- ERP ---------- */

    const btnErp =
        document.getElementById("btnErp");


    if (btnErp) {

        btnErp.addEventListener(
            "click",
            downloadErpSetup
        );

    }


    /* ---------- CAMWIN ---------- */

    const btnCamwin =
        document.getElementById("btnCamwin");


    if (btnCamwin) {

        btnCamwin.addEventListener(
            "click",
            downloadCamwinSetup
        );

    }

});


/* =====================================================
   DOWNLOAD FILE
===================================================== */

function downloadFile(content, filename) {

    const blob = new Blob(
        [content],
        {
            type: "application/octet-stream"
        }
    );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download = filename;


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);


    setTimeout(function () {

        URL.revokeObjectURL(url);

    }, 1000);

}


/* =====================================================
   ERP
===================================================== */

function downloadErpSetup() {

    const name =
        document
            .getElementById("computerName")
            .value
            .trim();


    if (!name) {

        alert("Vui lòng nhập tên máy tính!");

        return;

    }


    if (!/^[A-Za-z0-9-]{1,15}$/.test(name)) {

        alert(
            "Tên máy chỉ được chứa chữ, số và dấu - tối đa 15 ký tự."
        );

        return;

    }


    const token1 =
        "4g60AehCU2M9Ioi";


    const token2 =
        "2X0xnwIJbBv6gV2";


    const pass =
        "1";


    /*
       QUAN TRỌNG:

       Không sử dụng dấu backtick PowerShell
       trong chuỗi JavaScript.
    */


    const ps1 = [
        '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12',

        'Write-Host "==========================================" -ForegroundColor Cyan',
        'Write-Host "1. DANG DOI TEN MAY TINH..." -ForegroundColor Cyan',
        'Write-Host "==========================================" -ForegroundColor Cyan',

        'try {',
        '    Rename-Computer -NewName "' + name + '" -Force',
        '    Write-Host "-> Da dat ten may: ' + name + '" -ForegroundColor Green',
        '} catch {',
        '    Write-Host "-> Loi doi ten: $($_.Exception.Message)" -ForegroundColor Yellow',
        '}',

        'Write-Host ""',

        'Write-Host "==========================================" -ForegroundColor Cyan',
        'Write-Host "2. DANG TAI GOI 1..." -ForegroundColor Cyan',
        'Write-Host "==========================================" -ForegroundColor Cyan',

        '$auth1 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("' + token1 + ':' + pass + '"))',

        '$headers1 = @{',
        '    "Authorization" = "Basic " + $auth1',
        '    "X-Requested-With" = "XMLHttpRequest"',
        '}',

        '$file1 = "$env:TEMP\\installer_part1.exe"',

        'try {',

        '    Invoke-WebRequest -Uri "https://cloud.tgdd.vn/public.php/webdav/" -Headers $headers1 -OutFile $file1',

        '    Write-Host "-> Tai Goi 1 thanh cong!" -ForegroundColor Green',

        '    Start-Process -FilePath $file1 -ArgumentList "/S" -Wait',

        '    Write-Host "-> Da cai dat Goi 1!" -ForegroundColor Green',

        '} catch {',

        '    Write-Host "-> Loi Goi 1: $($_.Exception.Message)" -ForegroundColor Red',

        '}',


        'Write-Host ""',

        'Write-Host "==========================================" -ForegroundColor Cyan',
        'Write-Host "3. DANG TAI GOI 2..." -ForegroundColor Cyan',
        'Write-Host "==========================================" -ForegroundColor Cyan',

        '$auth2 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("' + token2 + ':' + pass + '"))',

        '$headers2 = @{',
        '    "Authorization" = "Basic " + $auth2',
        '    "X-Requested-With" = "XMLHttpRequest"',
        '}',

        '$file2 = "$env:TEMP\\installer_part2.exe"',

        'try {',

        '    Invoke-WebRequest -Uri "https://cloud.tgdd.vn/public.php/webdav/" -Headers $headers2 -OutFile $file2',

        '    Write-Host "-> Tai Goi 2 thanh cong!" -ForegroundColor Green',

        '    Start-Process -FilePath $file2 -ArgumentList "/S" -Wait',

        '    Write-Host "-> Da cai dat Goi 2!" -ForegroundColor Green',

        '} catch {',

        '    Write-Host "-> Loi Goi 2: $($_.Exception.Message)" -ForegroundColor Red',

        '}',


        'Write-Host ""',

        'Write-Host "==========================================" -ForegroundColor Green',
        'Write-Host "HOAN TAT!" -ForegroundColor Green',
        'Write-Host "==========================================" -ForegroundColor Green',

        'Write-Host ""',
        'Write-Host "Nhan phim bat ky de thoat..."',

        '[void][System.Console]::ReadKey()'

    ].join("\r\n");


    const encoded =
        btoa(
            unescape(
                encodeURIComponent(ps1)
            )
        );


    const bat = [
        "@echo off",

        "title TGDD ERP Auto Setup",

        "net session >nul 2>&1",

        "if %errorlevel% neq 0 (",

        "    echo Dang yeu cau quyen Administrator...",

        "    powershell -Command \"Start-Process '%~f0' -Verb RunAs\"",

        "    exit /b",

        ")",

        "",

        "set \"TEMP_PS1=%TEMP%\\run_erp_setup.ps1\"",

        "powershell.exe -NoProfile -Command \"[IO.File]::WriteAllText('%TEMP_PS1%', [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('" + encoded + "')))\"",

        "powershell.exe -NoProfile -ExecutionPolicy Bypass -File \"%TEMP_PS1%\"",

        "del \"%TEMP_PS1%\" >nul 2>&1",

        "pause"

    ].join("\r\n");


    downloadFile(
        bat,
        "Setup.bat"
    );

}


/* =====================================================
   CAMWIN
===================================================== */

function downloadCamwinSetup() {

    const status =
        document.getElementById("camwinStatus");


    status.textContent =
        "Đang tạo Setup-CamWin.bat...";


    status.classList.add("show");


    const fileId =
        "1KdaUimOzZPuzGNBC9MZZzLWJITRv5yrR";


    /*
       CAMWIN POWERSHELL

       Không dùng backtick ` nào ở đây.
    */


    const ps1 = [

        '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12',

        'Write-Host "==========================================" -ForegroundColor Cyan',

        'Write-Host "1. DANG TAI CAMWIN TU GOOGLE DRIVE..." -ForegroundColor Cyan',

        'Write-Host "==========================================" -ForegroundColor Cyan',

        '',

        '$camwinZip = "$env:TEMP\\CamWin.zip"',

        '$fileId = "' + fileId + '"',

        '$downloadUrl = "https://drive.usercontent.google.com/download?id=$fileId&export=download&confirm=t"',

        '',

        'if (Test-Path $camwinZip) {',

        '    Remove-Item $camwinZip -Force',

        '}',

        '',

        'try {',

        '    Write-Host "-> Dang ket noi Google Drive..." -ForegroundColor Yellow',

        '',

        '    $web = New-Object System.Net.WebClient',

        '',

        '    $web.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36")',

        '',

        '    $web.DownloadFile($downloadUrl, $camwinZip)',

        '',

        '    if (!(Test-Path $camwinZip)) {',

        '        throw "Khong tao duoc file CamWin.zip."',

        '    }',

        '',

        '    $size = (Get-Item $camwinZip).Length',

        '',

        '    Write-Host "-> Kich thuoc file: $size bytes" -ForegroundColor Gray',

        '',

        '    if ($size -lt 10000) {',

        '        throw "Google Drive tra ve trang HTML thay vi file ZIP. Kich thuoc: $size bytes."',

        '    }',

        '',

        '    Write-Host "-> Tai CamWin thanh cong!" -ForegroundColor Green',

        '',

        '} catch {',

        '',

        '    Write-Host "-> LOI TAI CAMWIN:" -ForegroundColor Red',

        '    Write-Host $_.Exception.Message -ForegroundColor Red',

        '',

        '    Write-Host "Kiem tra lai quyen chia se Google Drive." -ForegroundColor Yellow',

        '',

        '    if (Test-Path $camwinZip) {',

        '        Remove-Item $camwinZip -Force',

        '    }',

        '',

        '    Write-Host ""',

        '    Write-Host "Nhan phim bat ky de thoat..."',

        '    [void][System.Console]::ReadKey()',

        '    exit',

        '}',

        '',

        'if ($web) {',

        '    $web.Dispose()',

        '}',

        '',

        '',

        'Write-Host ""',

        'Write-Host "==========================================" -ForegroundColor Cyan',

        'Write-Host "2. DANG GIAI NEN CAMWIN..." -ForegroundColor Cyan',

        'Write-Host "==========================================" -ForegroundColor Cyan',

        '',

        '$extractPath = "$env:USERPROFILE\\Desktop\\CamWin"',

        '',

        'try {',

        '',

        '    if (Test-Path $extractPath) {',

        '        Remove-Item $extractPath -Recurse -Force',

        '    }',

        '',

        '    New-Item -ItemType Directory -Path $extractPath -Force | Out-Null',

        '',

        '    Expand-Archive -Path $camwinZip -DestinationPath $extractPath -Force',

        '',

        '    Write-Host "-> Giai nen thanh cong!" -ForegroundColor Green',

        '',

        '} catch {',

        '',

        '    Write-Host "-> LOI GIAI NEN:" -ForegroundColor Red',

        '    Write-Host $_.Exception.Message -ForegroundColor Red',

        '    Write-Host ""',

        '    [void][System.Console]::ReadKey()',

        '    exit',

        '}',

        '',

        '',

        'Write-Host ""',

        'Write-Host "==========================================" -ForegroundColor Cyan',

        'Write-Host "3. TIM FILE EXE..." -ForegroundColor Cyan',

        'Write-Host "==========================================" -ForegroundColor Cyan',

        '',

        '$camwinExe = Get-ChildItem -Path $extractPath -Filter "*.exe" -Recurse -File | Select-Object -First 1',

        '',

        'if (!$camwinExe) {',

        '',

        '    Write-Host "-> KHONG TIM THAY FILE EXE!" -ForegroundColor Red',

        '    Write-Host "-> Thu muc: $extractPath" -ForegroundColor Yellow',

        '',

        '} else {',

        '',

        '    Write-Host "-> Tim thay: $($camwinExe.FullName)" -ForegroundColor Green',

        '',

        '',

        '    Write-Host ""',

        '    Write-Host "==========================================" -ForegroundColor Cyan',

        '    Write-Host "4. TAO SHORTCUT DESKTOP..." -ForegroundColor Cyan',

        '    Write-Host "==========================================" -ForegroundColor Cyan',

        '',

        '    try {',

        '',

        '        $desktopPath = [Environment]::GetFolderPath("Desktop")',

        '',

        '        $shortcutPath = Join-Path $desktopPath "CamWin.lnk"',

        '',

        '        $shell = New-Object -ComObject WScript.Shell',

        '',

        '        $shortcut = $shell.CreateShortcut($shortcutPath)',

        '',

        '        $shortcut.TargetPath = $camwinExe.FullName',

        '',

        '        $shortcut.WorkingDirectory = $camwinExe.DirectoryName',

        '',

        '        $shortcut.IconLocation = "$($camwinExe.FullName),0"',

        '',

        '        $shortcut.Save()',

        '',

        '        Write-Host "-> Da tao shortcut CamWin!" -ForegroundColor Green',

        '',

        '    } catch {',

        '',

        '        Write-Host "-> Loi tao shortcut: $($_.Exception.Message)" -ForegroundColor Yellow',

        '',

        '    }',

        '',

        '',

        '    Write-Host ""',

        '    Write-Host "==========================================" -ForegroundColor Cyan',

        '    Write-Host "5. MO CAMWIN..." -ForegroundColor Cyan',

        '    Write-Host "==========================================" -ForegroundColor Cyan',

        '',

        '    try {',

        '',

        '        Start-Process -FilePath $camwinExe.FullName -WorkingDirectory $camwinExe.DirectoryName',

        '',

        '        Write-Host "-> Da mo CamWin!" -ForegroundColor Green',

        '',

        '    } catch {',

        '',

        '        Write-Host "-> Loi mo CamWin: $($_.Exception.Message)" -ForegroundColor Red',

        '',

        '    }',

        '',

        '}',

        '',

        '',

        'if (Test-Path $camwinZip) {',

        '    Remove-Item $camwinZip -Force',

        '}',

        '',

        'Write-Host ""',

        'Write-Host "==========================================" -ForegroundColor Green',

        'Write-Host "HOAN TAT CAMWIN!" -ForegroundColor Green',

        'Write-Host "==========================================" -ForegroundColor Green',

        '',

        'Write-Host "Nhan phim bat ky de thoat..."',

        '[void][System.Console]::ReadKey()'

    ].join("\r\n");


    const encoded =
        btoa(
            unescape(
                encodeURIComponent(ps1)
            )
        );


    const bat = [
        "@echo off",

        "title TGDD CamWin Auto Setup",

        "",

        "net session >nul 2>&1",

        "if %errorlevel% neq 0 (",

        "    echo Dang yeu cau quyen Administrator...",

        "    powershell -Command \"Start-Process '%~f0' -Verb RunAs\"",

        "    exit /b",

        ")",

        "",

        "set \"TEMP_PS1=%TEMP%\\run_camwin_setup.ps1\"",

        "",

        "powershell.exe -NoProfile -Command \"[IO.File]::WriteAllText('%TEMP_PS1%', [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('" + encoded + "')))\"",

        "",

        "powershell.exe -NoProfile -ExecutionPolicy Bypass -File \"%TEMP_PS1%\"",

        "",

        "del \"%TEMP_PS1%\" >nul 2>&1",

        "",

        "pause"

    ].join("\r\n");


    downloadFile(
        bat,
        "Setup-CamWin.bat"
    );


    status.textContent =
        "Đã tạo Setup-CamWin.bat. Hãy mở file và chọn Yes.";

}

</script>

</body>
</html>
