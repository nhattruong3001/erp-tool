<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình máy tính tự động - TGDD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }
        h2 {
            text-align: center;
            color: #333333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .note {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Thiết lập máy tính</h2>
    <div class="form-group">
        <label for="computerName">Nhập tên máy tính mới:</label>
        <input type="text" id="computerName" placeholder="Ví dụ: TGDD-KHO-01" required>
    </div>
    <button onclick="generateAndDownloadCMD()">Tải Gói Tự Động Cài Đặt</button>
    <p class="note">
        * Sau khi tải xong, chỉ cần <b>nhấp đúp mở file Setup.cmd</b> và chọn <b>Yes</b> khi được hỏi quyền Quản trị.
    </p>
</div>

<script>
function generateAndDownloadCMD() {
    const newName = document.getElementById('computerName').value.trim();
    if (!newName) {
        alert("Vui lòng nhập tên máy tính!");
        return;
    }

    const shareToken = "4g60AehCU2M9Ioi";
    const sharePassword = "1";
    const webdavUrl = "https://cloud.tgdd.vn/public.php/webdav/";

    // File CMD tích hợp cơ chế tự nâng quyền Admin + chạy PowerShell ngầm
    const cmdContent = `@echo off
:: Kiem tra va tu dong xin quyen Administrator
net session >nul 2>&1
if %errorLevel% neq 0 (
    echo Dang yeu cau quyen Administrator...
    powershell -Command "Start-Process cmd -ArgumentList '/c \"\"%~f0\"\"' -Verb RunAs"
    exit /b
)

:: Khi da co quyen Admin, chay script PowerShell cai dat
powershell -NoProfile -ExecutionPolicy Bypass -Command ^
    "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13;" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "Write-Host '1. DANG DOI TEN MAY TINH...' -ForegroundColor Cyan;" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "Rename-Computer -NewName '${newName}' -Force -ErrorAction SilentlyContinue;" ^
    "Write-Host '-> Da thiet lap doi ten thanh: ${newName}' -ForegroundColor Green;" ^
    "Write-Host '';" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "Write-Host '2. DANG TAI FILE TU CLOUD TGDD...' -ForegroundColor Cyan;" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "$auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('${shareToken}:${sharePassword}'));" ^
    "$headers = @{ 'Authorization' = 'Basic ' + $auth; 'X-Requested-With' = 'XMLHttpRequest' };" ^
    "$installer = [System.IO.Path]::Combine($env:TEMP, 'setup_installer.exe');" ^
    "try {" ^
    "    Invoke-WebRequest -Uri '${webdavUrl}' -Headers $headers -OutFile $installer;" ^
    "    Write-Host '-> Tai file thanh cong!' -ForegroundColor Green;" ^
    "} catch {" ^
    "    Write-Host '-> Loi khi tai file tu Cloud: ' $_ -ForegroundColor Red;" ^
    "    Pause; Exit;" ^
    "};" ^
    "Write-Host '';" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "Write-Host '3. DANG TIEN HANH CAI DAT APPS...' -ForegroundColor Cyan;" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "Start-Process -FilePath $installer -ArgumentList '/S' -Wait;" ^
    "Write-Host '';" ^
    "Write-Host '----------------------------------------' -ForegroundColor Green;" ^
    "Write-Host 'HOAN TAT! Vui long khoi dong lai may tinh.' -ForegroundColor Green;" ^
    "Write-Host '----------------------------------------' -ForegroundColor Green;" ^
    "Pause;"
`;

    // Tải xuống file .cmd
    const blob = new Blob([cmdContent], { type: 'text/plain;charset=utf-8' });
    const downloadLink = document.createElement('a');
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.download = "Setup.cmd";
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
}
</script>

</body>
</html>
