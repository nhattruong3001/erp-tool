<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình máy tính tự động - TGDD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }
        h2 {
            text-align: center;
            color: #333333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .note {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Thiết lập máy tính</h2>
    <div class="form-group">
        <label for="computerName">Nhập tên máy tính mới:</label>
        <input type="text" id="computerName" placeholder="Ví dụ: 179188" required>
    </div>
    <button onclick="downloadSetupBat()">Tải Gói Cài Đặt (2 File)</button>
    <p class="note">
        * Sau khi tải xong, nhấp đúp vào file <b>Setup.bat</b> và chọn <b>Yes</b> để tự động tải và cài đặt cả 2 gói.
    </p>
</div>

<script>
function downloadSetupBat() {
    const newName = document.getElementById('computerName').value.trim();
    if (!newName) {
        alert("Vui lòng nhập tên máy tính!");
        return;
    }

    const token1 = "4g60AehCU2M9Ioi";
    const token2 = "2X0xnwIJbBv6gV2";
    const sharePass = "1";

    const batContent = `@echo off
:: Tu dong xin quyen Administrator
net session >nul 2>&1
if %errorLevel% neq 0 (
    powershell -Command "Start-Process cmd -ArgumentList '/c \"\"%~f0\"\"' -Verb RunAs"
    exit /b
)

powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ^
    "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13;" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "Write-Host '1. DANG DOI TEN MAY TINH...' -ForegroundColor Cyan;" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "Rename-Computer -NewName '${newName}' -Force -ErrorAction SilentlyContinue;" ^
    "Write-Host '-> Da thiet lap doi ten thanh: ${newName}' -ForegroundColor Green;" ^
    "Write-Host '';" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "Write-Host '2. DANG TAI & CAI DAT GOI 1...' -ForegroundColor Cyan;" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "$auth1 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('${token1}:${sharePass}'));" ^
    "$headers1 = @{ 'Authorization' = 'Basic ' + $auth1; 'X-Requested-With' = 'XMLHttpRequest' };" ^
    "$file1 = [System.IO.Path]::Combine($env:TEMP, 'installer_part1.exe');" ^
    "try {" ^
    "    Invoke-WebRequest -Uri 'https://cloud.tgdd.vn/public.php/webdav/' -Headers $headers1 -OutFile $file1;" ^
    "    Write-Host '-> Tai File 1 thanh cong! Dang khoi chay cai dat...' -ForegroundColor Green;" ^
    "    Start-Process -FilePath $file1 -ArgumentList '/S' -Wait;" ^
    "    Write-Host '-> Da cai dat xong Goi 1!' -ForegroundColor Green;" ^
    "} catch {" ^
    "    Write-Host '-> Loi khi tai Goi 1: ' $_ -ForegroundColor Red;" ^
    "};" ^
    "Write-Host '';" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "Write-Host '3. DANG TAI & CAI DAT GOI 2...' -ForegroundColor Cyan;" ^
    "Write-Host '========================================' -ForegroundColor Cyan;" ^
    "$auth2 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('${token2}:${sharePass}'));" ^
    "$headers2 = @{ 'Authorization' = 'Basic ' + $auth2; 'X-Requested-With' = 'XMLHttpRequest' };" ^
    "$file2 = [System.IO.Path]::Combine($env:TEMP, 'installer_part2.exe');" ^
    "try {" ^
    "    Invoke-WebRequest -Uri 'https://cloud.tgdd.vn/public.php/webdav/' -Headers $headers2 -OutFile $file2;" ^
    "    Write-Host '-> Tai File 2 thanh cong! Dang khoi chay cai dat...' -ForegroundColor Green;" ^
    "    Start-Process -FilePath $file2 -ArgumentList '/S' -Wait;" ^
    "    Write-Host '-> Da cai dat xong Goi 2!' -ForegroundColor Green;" ^
    "} catch {" ^
    "    Write-Host '-> Loi khi tai Goi 2: ' $_ -ForegroundColor Red;" ^
    "};" ^
    "Write-Host '';" ^
    "Write-Host '----------------------------------------' -ForegroundColor Green;" ^
    "Write-Host 'TAT CA HOAN TAT! Vui long khoi dong lai may.' -ForegroundColor Green;" ^
    "Write-Host '----------------------------------------' -ForegroundColor Green;" ^
    "Pause;"
`;

    const blob = new Blob([batContent], { type: 'application/bat' });
    const downloadLink = document.createElement('a');
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.download = "Setup.bat";
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
}
</script>

</body>
</html>
